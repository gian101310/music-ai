services:
  - type: web
    name: scheduled-ai-music-n8n
    runtime: docker
    plan: free
    envVars:
      - key: N8N_USER_FOLDER
        value: /tmp/n8n-user
      - key: N8N_RUNNERS_BROKER_PORT
        value: "5679"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_EDITOR_BASE_URL
        value: https://scheduled-ai-music-n8n.onrender.com
      - key: GENERIC_TIMEZONE
        value: Etc/UTC
      - key: TZ
        value: Etc/UTC
      - key: NODE_FUNCTION_ALLOW_BUILTIN
        value: fs,path,crypto
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: scheduled-ai-music-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: scheduled-ai-music-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: scheduled-ai-music-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: scheduled-ai-music-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: scheduled-ai-music-n8n-db
          property: password
      - key: OPENAI_API_KEY
        sync: false
      - key: MUSICGPT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false

databases:
  - name: scheduled-ai-music-n8n-db
    plan: free
